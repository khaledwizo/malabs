name: Build Rafidain APKs

on:
  push:
    branches: [rafidain-game]
    paths-ignore: ['apk/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rafidain-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # أصوات عراقية حقيقية (Azure ar-IQ) — تُضاف في Settings › Secrets › Actions
      AZ_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZ_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
    steps:
      - uses: actions/checkout@v4

      # البناية تبدأ من الالتزام الذي شغّلها، فنجلب ملفّات الأصوات من رأس الفرع (اللي ولّدتها بنايات سابقة)
      - name: Bring voice files from the branch head
        continue-on-error: true
        run: |
          git fetch -q --depth=1 origin rafidain-game
          git ls-tree -r --name-only FETCH_HEAD game/voice | grep '\.ogg$' | xargs -r git checkout FETCH_HEAD --
          echo "ogg from head: $(ls game/voice/*.ogg 2>/dev/null | wc -l)"

      - name: Generate Iraqi voice lines (Azure ar-IQ, incremental)
        if: ${{ env.AZ_KEY != '' }}
        continue-on-error: true
        run: python3 game/tools/gen_voices.py game/voice/lines.json game/voice

      - name: Copy the game and server pages
        run: |
          mkdir -p app/src/main/assets server/src/main/assets
          cp game/index.html app/src/main/assets/index.html
          cp game/server.html server/src/main/assets/server.html
          if [ -f game/voice/manifest.js ]; then mkdir -p app/src/main/assets/voice && cp game/voice/manifest.js app/src/main/assets/voice/ && (cp game/voice/*.ogg app/src/main/assets/voice/ 2>/dev/null || true); echo "voices: $(ls app/src/main/assets/voice | wc -l)"; fi

      - name: Bundle fonts for offline use
        continue-on-error: true
        run: |
          python3 game/tools/apk_fonts.py app/src/main/assets index.html
          python3 game/tools/apk_fonts.py server/src/main/assets server.html

      # نسخة آيفون: نفس الصفحة (بالخطوط) + الأصوات بصيغة m4a (سفاري/WKWebView ما يشغّل ogg opus بكل الإصدارات)
      - name: Prepare iOS web bundle (m4a voices)
        continue-on-error: true
        run: |
          mkdir -p iosweb/voice
          cp app/src/main/assets/index.html iosweb/
          if [ -d app/src/main/assets/fonts ]; then cp -r app/src/main/assets/fonts iosweb/; fi
          if ls game/voice/*.ogg >/dev/null 2>&1; then
            command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; }
            cp game/voice/manifest.js iosweb/voice/
            ls game/voice/*.ogg | xargs -P 4 -I{} sh -c 'b=$(basename "{}" .ogg); ffmpeg -loglevel error -y -i "{}" -c:a aac -b:a 32k -ac 1 -ar 24000 "iosweb/voice/$b.m4a"'
          fi
          echo "ios web: $(ls iosweb/voice | grep -c m4a) voices, $(du -sh iosweb | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-www
          path: iosweb
          retention-days: 3

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # مفتاح توقيع ثابت بين البنايات (محفوظ في ذاكرة GitHub المؤقتة، لا في المستودع) كي تُثبَّت التحديثات فوق بعضها
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: rafidain-debug-keystore-v1

      - name: Build APKs
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          gradle :app:assembleRelease :server:assembleRelease --no-daemon -PvCode=${{ github.run_number }} 2>&1 | tee build-log.txt

      - name: Commit APKs back to the branch
        shell: bash
        run: |
          mkdir -p /tmp/out/voice apk
          cp app/build/outputs/apk/release/app-release.apk /tmp/out/rafidain.apk || exit 1
          cp server/build/outputs/apk/release/server-release.apk /tmp/out/rafidain-server.apk || exit 1
          cp -r game/voice/. /tmp/out/voice/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            # نبني فوق رأس الفرع الحالي (بدل rebase) حتى لا تتعارض ملفّات الـAPK والأصوات الثنائية
            git fetch -q origin rafidain-game && git reset -q --hard FETCH_HEAD || { sleep 5; continue; }
            mkdir -p apk game/voice
            cp /tmp/out/rafidain.apk apk/rafidain.apk
            cp /tmp/out/rafidain-server.apk apk/rafidain-server.apk
            rm -f apk/build-log.txt
            python3 - <<'PY'
          import os, json, shutil, filecmp
          src, dst = '/tmp/out/voice', 'game/voice'
          dl, sl = os.path.join(dst, 'lines.json'), os.path.join(src, 'lines.json')
          if os.path.exists(dl):
              ids = {l['id'] for l in json.load(open(dl, encoding='utf-8'))}
              add = rem = 0
              for f in os.listdir(src):
                  if f.endswith('.ogg') and f[:-4] in ids and not os.path.exists(os.path.join(dst, f)):
                      shutil.copy(os.path.join(src, f), dst); add += 1
              for f in os.listdir(dst):
                  if f.endswith('.ogg') and f[:-4] not in ids:
                      os.remove(os.path.join(dst, f)); rem += 1
              same = os.path.exists(sl) and filecmp.cmp(sl, dl, shallow=False)
              if same and os.path.exists(os.path.join(src, 'manifest.js')):
                  shutil.copy(os.path.join(src, 'manifest.js'), dst)
              print(f'voices merged: +{add} -{rem} manifest {"updated" if same else "kept (newer code on branch)"}')
          PY
            git add -f -A apk game/voice
            git commit -q -m "APK build #${{ github.run_number }} [skip ci]" || true
            git push -q origin HEAD:rafidain-game && break
            sleep 5
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Rafidain-APKs
          path: |
            apk/rafidain.apk
            apk/rafidain-server.apk

      - name: Save build log on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p apk
          cp build-log.txt apk/build-log.txt 2>/dev/null || echo "no log (failed before gradle)" > apk/build-log.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp apk/build-log.txt /tmp/build-log.txt
          for i in 1 2 3; do
            git fetch -q origin rafidain-game && git reset -q --hard FETCH_HEAD || { sleep 5; continue; }
            mkdir -p apk && cp /tmp/build-log.txt apk/build-log.txt
            git add -f apk/build-log.txt
            git commit -q -m "Build log (failed) #${{ github.run_number }} [skip ci]" || true
            git push -q origin HEAD:rafidain-game && break
            sleep 5
          done

  # تطبيق آيفون (‎.ipa‎ غير موقّع رسمياً — يُثبَّت عبر Sideloadly أو AltStore بحساب Apple)
  ios:
    needs: build
    # موقوف مؤقتاً (المستخدم طلب APK فقط بالمراحل الحالية) — غيّرها لـ true لإعادة بناء الآيفون
    if: ${{ false && !cancelled() && needs.build.result == 'success' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ios-www
          path: ios/www

      - name: Build IPA
        run: bash ios/build_ipa.sh ${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: Rafidain-iOS
          path: ios/rafidain-ios.ipa

      - name: Commit IPA back to the branch
        shell: bash
        run: |
          cp ios/rafidain-ios.ipa /tmp/rafidain-ios.ipa
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch -q origin rafidain-game && git reset -q --hard FETCH_HEAD || { sleep 5; continue; }
            mkdir -p apk && cp /tmp/rafidain-ios.ipa apk/rafidain-ios.ipa
            git add -f apk/rafidain-ios.ipa
            git commit -q -m "iOS build #${{ github.run_number }} [skip ci]" || true
            git push -q origin HEAD:rafidain-game && break
            sleep 5
          done
